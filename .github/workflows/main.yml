name: Compila APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TastieraPersonale
    steps:
      # Action fissate a un commit preciso (il commento dice la versione): un tag si può spostare, uno SHA no.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.11.1"

      - name: Prova il correttore
        run: gradle testDebugUnitTest

      # La chiave di firma arriva dai secret del repository e vive solo per la durata della compilazione.
      - name: Prepara la chiave di firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Manca il secret KEYSTORE_BASE64: vedi il README, sezione 'Chiave di firma'."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/tastiera.jks"

      - name: Compila la tastiera
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/tastiera.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease

      - name: Cancella la chiave
        if: always()
        run: rm -f "$RUNNER_TEMP/tastiera.jks"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: la-mia-tastiera
          path: TastieraPersonale/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
