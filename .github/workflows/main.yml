name: Compila APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TastieraPersonale
    steps:
      # Action fissate a un commit preciso (il commento dice la versione): un tag si può spostare, uno SHA no.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          gradle-version: "8.11.1"

      - name: Prova il correttore
        run: gradle testDebugUnitTest

      # La chiave di firma arriva dai secret del repository e vive solo per la durata della compilazione.
      - name: Prepara la chiave di firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Manca il secret KEYSTORE_BASE64: vedi il README, sezione 'Chiave di firma'."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/tastiera.jks"

      - name: Compila la tastiera
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/tastiera.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease

      - name: Cancella la chiave
        if: always()
        run: rm -f "$RUNNER_TEMP/tastiera.jks"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: la-mia-tastiera
          path: TastieraPersonale/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
