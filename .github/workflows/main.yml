name: Compila APK

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TastieraPersonale
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Scarica il dizionario completo
        run: |
          curl -fsSL -o /tmp/it_full.txt https://raw.githubusercontent.com/hermitdave/FrequencyWords/master/content/2016/it/it_full.txt \
            && head -n 60000 /tmp/it_full.txt > app/src/main/assets/parole_it.txt \
            && echo "Dizionario scaricato: $(wc -l < app/src/main/assets/parole_it.txt) parole" \
            || echo "Download non riuscito: uso il dizionario incluso"

      - name: Compila la tastiera
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: la-mia-tastiera
          path: TastieraPersonale/app/build/outputs/apk/debug/app-debug.apk
