<svg xmlns="http://www.w3.org/2000/svg" width="520" height="170" viewBox="0 0 520 170" role="img" aria-label="Dialog box: the keyboard has no permission to use the Internet"><title>Dialog box: the keyboard has no permission to use the Internet</title><defs><linearGradient id="titolo" x1="0" x2="1"><stop offset="0" stop-color="#000080"/><stop offset="1" stop-color="#1084d0"/></linearGradient></defs><g shape-rendering="crispEdges" ><rect x="0" y="0" width="520" height="170" fill="#c0c0c0"/><path d="M0.5,169 V0.5 H519" stroke="#ffffff" fill="none"/><path d="M1.5,168 V1.5 H518" stroke="#dfdfdf" fill="none"/><path d="M0,169.5 H519.5 V0" stroke="#000000" fill="none"/><path d="M1,168.5 H518.5 V1" stroke="#808080" fill="none"/></g><rect x="3" y="3" width="514" height="18" fill="url(#titolo)"/><text x="8" y="16" font-family="'MS Sans Serif','Microsoft Sans Serif',Tahoma,'Segoe UI',Arial,sans-serif" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="start" xml:space="preserve" >Privacy</text><g shape-rendering="crispEdges" ><rect x="499" y="5" width="16" height="14" fill="#c0c0c0"/><path d="M499.5,18 V5.5 H514" stroke="#ffffff" fill="none"/><path d="M500.5,17 V6.5 H513" stroke="#dfdfdf" fill="none"/><path d="M499,18.5 H514.5 V5" stroke="#000000" fill="none"/><path d="M500,17.5 H513.5 V6" stroke="#808080" fill="none"/></g><text x="507" y="16" font-family="'MS Sans Serif','Microsoft Sans Serif',Tahoma,'Segoe UI',Arial,sans-serif" font-size="11" fill="#000000" font-weight="bold" text-anchor="middle" xml:space="preserve" >×</text><circle cx="46" cy="62" r="20" fill="#000080" stroke="#000000"/><text x="46" y="71" font-family="Georgia,serif" font-size="26" fill="#ffffff" font-weight="bold" text-anchor="middle" xml:space="preserve" >i</text><text x="84" y="50" font-family="'MS Sans Serif','Microsoft Sans Serif',Tahoma,'Segoe UI',Arial,sans-serif" font-size="12" fill="#000000" font-weight="bold" text-anchor="start" xml:space="preserve" >My Keyboard has no permission to use the Internet.</text><text x="84" y="68" font-family="'MS Sans Serif','Microsoft Sans Serif',Tahoma,'Segoe UI',Arial,sans-serif" font-size="12" fill="#000000" font-weight="normal" text-anchor="start" xml:space="preserve" >What you type stays on your phone: no servers, no analytics,</text><text x="84" y="86" font-family="'MS Sans Serif','Microsoft Sans Serif',Tahoma,'Segoe UI',Arial,sans-serif" font-size="12" fill="#000000" font-weight="normal" text-anchor="start" xml:space="preserve" >no cloud backups. Passwords and incognito mode are never</text><text x="84" y="104" font-family="'MS Sans Serif','Microsoft Sans Serif',Tahoma,'Segoe UI',Arial,sans-serif" font-size="12" fill="#000000" font-weight="normal" text-anchor="start" xml:space="preserve" >learned.</text><rect x="159.0" y="127" width="90" height="28" fill="#000000"/><g shape-rendering="crispEdges" ><rect x="160.0" y="128" width="88" height="26" fill="#c0c0c0"/><path d="M160.5,153 V128.5 H247.0" stroke="#ffffff" fill="none"/><path d="M161.5,152 V129.5 H246.0" stroke="#dfdfdf" fill="none"/><path d="M160.0,153.5 H247.5 V128" stroke="#000000" fill="none"/><path d="M161.0,152.5 H246.5 V129" stroke="#808080" fill="none"/></g><g opacity="0"><g shape-rendering="crispEdges" ><rect x="160.0" y="128" width="88" height="26" fill="#c0c0c0"/><path d="M160.5,153 V128.5 H247.0" stroke="#808080" fill="none"/><path d="M161.5,152 V129.5 H246.0" stroke="#000000" fill="none"/><path d="M160.0,153.5 H247.5 V128" stroke="#ffffff" fill="none"/><path d="M161.0,152.5 H246.5 V129" stroke="#dfdfdf" fill="none"/></g><animate attributeName="opacity" values="0;1;0" keyTimes="0.0000;0.7500;0.8000" dur="4s" calcMode="discrete" repeatCount="indefinite" /></g><rect x="165.0" y="133" width="78" height="16" fill="none" stroke="#000000" stroke-dasharray="1,1"/><text x="204.0" y="145" font-family="'MS Sans Serif','Microsoft Sans Serif',Tahoma,'Segoe UI',Arial,sans-serif" font-size="12" fill="#000000" font-weight="normal" text-anchor="middle" xml:space="preserve" >OK</text><g shape-rendering="crispEdges" ><rect x="272.0" y="128" width="100" height="26" fill="#c0c0c0"/><path d="M272.5,153 V128.5 H371.0" stroke="#ffffff" fill="none"/><path d="M273.5,152 V129.5 H370.0" stroke="#dfdfdf" fill="none"/><path d="M272.0,153.5 H371.5 V128" stroke="#000000" fill="none"/><path d="M273.0,152.5 H370.5 V129" stroke="#808080" fill="none"/></g><text x="322.0" y="145" font-family="'MS Sans Serif','Microsoft Sans Serif',Tahoma,'Segoe UI',Arial,sans-serif" font-size="12" fill="#000000" font-weight="normal" text-anchor="middle" xml:space="preserve" >Details &gt;&gt;</text></svg>
