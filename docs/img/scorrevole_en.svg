<svg xmlns="http://www.w3.org/2000/svg" width="860" height="54" viewBox="0 0 860 54" role="img" aria-label="Scrolling marquee: thank you for using My Keyboard"><title>Scrolling marquee: thank you for using My Keyboard</title><defs><linearGradient id="titolo" x1="0" x2="1"><stop offset="0" stop-color="#000080"/><stop offset="1" stop-color="#1084d0"/></linearGradient></defs><rect width="860" height="54" fill="#000000"/><g><animateTransform attributeName="transform" type="translate" from="860,0" to="-1265,0" dur="22s" repeatCount="indefinite"/><text x="0" y="35" font-family="'Courier New','Lucida Console','DejaVu Sans Mono',monospace" font-size="20" fill="#00ff00" font-weight="bold" text-anchor="start" xml:space="preserve" >✦ Thank you for using My Keyboard ✦ No data ever leaves your phone ✦ Press ⌫ right after a correction to undo it ✦ </text></g></svg>
